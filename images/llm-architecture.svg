<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">Reconfigurable architecture for language model serving</title><desc id="desc">A reconfigurable chip supports language model serving, quantization, and sparsity through adaptable compute, dataflow, and memory resources.</desc>

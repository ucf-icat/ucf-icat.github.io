<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">Cross-layer intelligent infrastructure for chip design</title><desc id="desc">An intelligent cross-layer stack connects AI models, compilers, RTL optimization, and physical design optimization with feedback across layers.</desc>

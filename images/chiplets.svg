<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="400" height="220" fill="#eef1f8"/>

  <!-- package substrate -->
  <rect x="30" y="150" width="340" height="26" rx="3" fill="none" stroke="#0a1730" stroke-width="1.3"/>
  <text x="200" y="167" text-anchor="middle" font-size="10" fill="#b9791a">Package Substrate</text>

  <!-- interposer -->
  <rect x="40" y="118" width="320" height="24" rx="2" fill="#d7deee" stroke="#0a1730" stroke-width="1.3"/>
  <text x="200" y="134" text-anchor="middle" font-size="9.5" fill="#b9791a">Silicon Interposer</text>

  <!-- vias connecting substrate to interposer -->
  <g stroke="#8a9bc2" stroke-width="1">
    <line x1="70" y1="142" x2="70" y2="150"/>
    <line x1="150" y1="142" x2="150" y2="150"/>
    <line x1="250" y1="142" x2="250" y2="150"/>
    <line x1="330" y1="142" x2="330" y2="150"/>
  </g>

  <!-- chiplets on top -->
  <g stroke="#0a1730" stroke-width="1.4" fill="#ffffff">
    <rect x="46" y="52" width="80" height="60" rx="3"/>
    <rect x="150" y="40" width="90" height="72" rx="3"/>
    <rect x="264" y="58" width="72" height="54" rx="3"/>
  </g>

  <g font-size="10.5" fill="#0a1730" text-anchor="middle">
    <text x="86" y="86">CPU</text>
    <text x="86" y="99" font-size="8" fill="#b9791a">Chiplet</text>

    <text x="195" y="78">Accelerator</text>
    <text x="195" y="91" font-size="8" fill="#b9791a">Chiplet</text>

    <text x="300" y="88">HBM</text>
    <text x="300" y="101" font-size="8" fill="#b9791a">Memory</text>
  </g>

  <!-- die-to-die links across interposer -->
  <g stroke="#b9791a" stroke-width="1.3">
    <line x1="126" y1="130" x2="150" y2="130"/>
    <line x1="240" y1="130" x2="264" y2="130"/>
  </g>
  <g fill="#b9791a">
    <circle cx="138" cy="130" r="2.2"/>
    <circle cx="252" cy="130" r="2.2"/>
  </g>

  <text x="200" y="205" text-anchor="middle" font-size="10" fill="#8a9bc2">2.5D chiplet integration over a shared interposer</text>
</svg>

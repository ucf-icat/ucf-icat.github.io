<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="400" height="220" fill="#eef1f8"/>

  <!-- global buffer -->
  <rect x="40" y="24" width="320" height="26" rx="3" fill="none" stroke="#0a1730" stroke-width="1.5"/>
  <text x="200" y="41" text-anchor="middle" font-size="11" fill="#0a1730">Global Buffer</text>

  <!-- feed arrows from buffer into array -->
  <g stroke="#b9791a" stroke-width="1" marker-end="url(#arrow)">
    <line x1="80" y1="50" x2="80" y2="62"/>
    <line x1="152" y1="50" x2="152" y2="62"/>
    <line x1="224" y1="50" x2="224" y2="62"/>
    <line x1="296" y1="50" x2="296" y2="62"/>
  </g>

  <!-- PE array 4x4 -->
  <g stroke="#0a1730" stroke-width="1.3" fill="#ffffff">
    <!-- rows -->
    <g>
      <rect x="60" y="64" width="40" height="30" rx="2"/>
      <rect x="132" y="64" width="40" height="30" rx="2"/>
      <rect x="204" y="64" width="40" height="30" rx="2"/>
      <rect x="276" y="64" width="40" height="30" rx="2"/>

      <rect x="60" y="102" width="40" height="30" rx="2"/>
      <rect x="132" y="102" width="40" height="30" rx="2"/>
      <rect x="204" y="102" width="40" height="30" rx="2"/>
      <rect x="276" y="102" width="40" height="30" rx="2"/>

      <rect x="60" y="140" width="40" height="30" rx="2"/>
      <rect x="132" y="140" width="40" height="30" rx="2"/>
      <rect x="204" y="140" width="40" height="30" rx="2"/>
      <rect x="276" y="140" width="40" height="30" rx="2"/>
    </g>
  </g>

  <!-- PE labels -->
  <g font-size="8.5" fill="#b9791a" text-anchor="middle">
    <text x="80" y="82">PE</text><text x="152" y="82">PE</text><text x="224" y="82">PE</text><text x="296" y="82">PE</text>
    <text x="80" y="120">PE</text><text x="152" y="120">PE</text><text x="224" y="120">PE</text><text x="296" y="120">PE</text>
    <text x="80" y="158">PE</text><text x="152" y="158">PE</text><text x="224" y="158">PE</text><text x="296" y="158">PE</text>
  </g>

  <!-- horizontal dataflow arrows between PEs -->
  <g stroke="#8a9bc2" stroke-width="0.8" marker-end="url(#arrowlight)">
    <line x1="100" y1="79" x2="130" y2="79"/>
    <line x1="172" y1="79" x2="202" y2="79"/>
    <line x1="244" y1="79" x2="274" y2="79"/>

    <line x1="100" y1="117" x2="130" y2="117"/>
    <line x1="172" y1="117" x2="202" y2="117"/>
    <line x1="244" y1="117" x2="274" y2="117"/>

    <line x1="100" y1="155" x2="130" y2="155"/>
    <line x1="172" y1="155" x2="202" y2="155"/>
    <line x1="244" y1="155" x2="274" y2="155"/>
  </g>

  <!-- vertical dataflow arrows -->
  <g stroke="#8a9bc2" stroke-width="0.8" marker-end="url(#arrowlight)">
    <line x1="80" y1="94" x2="80" y2="100"/>
    <line x1="80" y1="132" x2="80" y2="138"/>
  </g>

  <!-- output arrow -->
  <g stroke="#b9791a" stroke-width="1.2" marker-end="url(#arrow)">
    <line x1="296" y1="170" x2="296" y2="196"/>
  </g>
  <text x="296" y="209" text-anchor="middle" font-size="10" fill="#0a1730">Output</text>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b9791a"/>
    </marker>
    <marker id="arrowlight" markerWidth="6" markerHeight="6" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#8a9bc2"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="400" height="220" fill="#eef1f8"/>

  <!-- pipeline boxes -->
  <g stroke="#0a1730" stroke-width="1.3" fill="#ffffff">
    <rect x="16" y="80" width="64" height="40" rx="4"/>
    <rect x="150" y="60" width="76" height="60" rx="4"/>
    <rect x="308" y="80" width="76" height="40" rx="4"/>
  </g>

  <text x="48" y="103" text-anchor="middle" font-size="9.5" fill="#0a1730">Design</text>
  <text x="48" y="114" text-anchor="middle" font-size="9.5" fill="#0a1730">Spec</text>

  <text x="188" y="88" text-anchor="middle" font-size="9.5" fill="#0a1730">ML Model</text>
  <text x="188" y="99" text-anchor="middle" font-size="8" fill="#b9791a">(GNN / RL)</text>

  <text x="346" y="103" text-anchor="middle" font-size="9.5" fill="#0a1730">Optimized</text>
  <text x="346" y="114" text-anchor="middle" font-size="9.5" fill="#0a1730">Layout</text>

  <!-- arrows spec -> model -> layout -->
  <g stroke="#b9791a" stroke-width="1.3" marker-end="url(#arrowE)">
    <line x1="80" y1="100" x2="146" y2="90"/>
    <line x1="226" y1="90" x2="304" y2="100"/>
  </g>

  <!-- sub-stage chips under ML model: placement / synthesis / routing -->
  <g stroke="#0a1730" stroke-width="1" fill="#d7deee">
    <rect x="140" y="150" width="48" height="24" rx="3"/>
    <rect x="196" y="150" width="48" height="24" rx="3"/>
    <rect x="252" y="150" width="48" height="24" rx="3"/>
  </g>
  <g font-size="7.5" fill="#0a1730" text-anchor="middle">
    <text x="164" y="165">Placement</text>
    <text x="220" y="165">Synthesis</text>
    <text x="276" y="165">Routing</text>
  </g>
  <g stroke="#8a9bc2" stroke-width="0.9">
    <line x1="188" y1="162" x2="196" y2="162"/>
    <line x1="244" y1="162" x2="252" y2="162"/>
    <line x1="188" y1="150" x2="188" y2="120"/>
  </g>

  <!-- feedback loop -->
  <path d="M 384 120 C 384 190, 200 200, 188 174" fill="none" stroke="#8a9bc2" stroke-width="1.1" stroke-dasharray="3,3" marker-end="url(#arrowLight2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="8.5" fill="#8a9bc2">PPA feedback</text>

  <defs>
    <marker id="arrowE" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b9791a"/>
    </marker>
    <marker id="arrowLight2" markerWidth="6" markerHeight="6" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#8a9bc2"/>
    </marker>
  </defs>
</svg>
